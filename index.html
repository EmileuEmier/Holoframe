<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Holoframe" />
    <title>Holoframe</title>
  </head>
  <body>
    <video id="camera" class="camera-video" autoplay muted playsinline></video>
    <canvas id="scene" class="scene-canvas" aria-hidden="true"></canvas>
    <canvas id="hud" class="hud-canvas" aria-hidden="true"></canvas>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <div id="landing" class="landing">
      <div class="landing__inner">
        <h1 class="landing__title" id="landing-title"></h1>
        <p class="landing__tagline" id="landing-tagline"></p>
        <ul class="landing__gestures" id="landing-gestures"></ul>
        <p class="landing__privacy" id="landing-privacy"></p>
        <label class="landing__check" id="landing-fullscreen-row">
          <input type="checkbox" id="landing-fullscreen" />
          <span id="landing-fullscreen-label"></span>
        </label>
        <button type="button" id="landing-start" class="landing__start"></button>
        <p class="landing__error" id="landing-error" hidden></p>
        <button type="button" id="landing-retry" class="landing__retry" hidden></button>
      </div>
    </div>

    <div id="toolbar" class="toolbar" role="toolbar" aria-label="Kontroller" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
